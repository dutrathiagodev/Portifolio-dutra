<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="contato.css" />
    <link rel="icon" href="../img/FAVICON.ICO" type="image/x-icon" />
    <title>Thiago Dutra | Contato</title>
  </head>

  <body>
    <header class="header">
      <nav class="navbar">
        <a href="../index.html" class="logo">TD<span>.dev</span></a>

        <div class="nav-links">
          <a href="../sobre/sobre.html">SOBRE</a>
          <a href="../experiencia/experiencia.html">EXPERIÊNCIA</a>
          <a href="../projetos/projetos.html">PROJETOS</a>
          <a href="../skills/skills.html">SKILLS</a>
          <a href="contato.html">CONTATO</a>
        </div>
      </nav>
    </header>

    <main class="page">
      <div class="contact-card">
        <div class="contact-hero">
          <div class="contact-intro">
            <p class="section-label">CONTATO</p>
            <h1>Bora trocar uma ideia?</h1>
          </div>

          <form id="contact-form" class="mad-lib">
            <p>
              Meu nome é
              <input
                type="text"
                id="field-name"
                placeholder="SEU NOME COMPLETO"
                autocomplete="off"
                required
              />
              e quero falar sobre
              <input
                type="text"
                id="field-subject"
                placeholder="UM PROJETO, IDEIA OU PROPOSTA"
                autocomplete="off"
                required
              />. Você pode me encontrar em
              <input
                type="email"
                id="field-email"
                placeholder="SEU E-MAIL"
                autocomplete="off"
                required
              />
              pra começarmos.
            </p>

            <button type="submit" class="send-btn">ENVIAR</button>
          </form>
        </div>

        <div class="contact-footer">
          <p class="footer-copy">© Thiago Dutra 2026</p>

          <div class="social-links">
            <a
              href="https://www.linkedin.com/in/dutrathiagodev"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn"
            >
              <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/linkedin.svg"
                alt="LinkedIn"
              />
            </a>

            <a
              href="https://github.com/dutrathiagodev"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub"
            >
              <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/github.svg"
                alt="GitHub"
              />
            </a>

            <a
              href="https://wa.me/5543999737688"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="WhatsApp"
            >
              <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/whatsapp.svg"
                alt="WhatsApp"
              />
            </a>

            <a
              href="https://www.instagram.com/dutrathiago.dev/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram"
            >
              <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/instagram.svg"
                alt="Instagram"
              />
            </a>

            <a href="mailto:thiagodutrasap@gmail.com" aria-label="Email">
              <img
                src="https://cdn.jsdelivr.net/npm/simple-icons@latest/icons/gmail.svg"
                alt="Email"
              />
            </a>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/nav.js"></script>
    <script src="./contato.js"></script>
  </body>
</html>
